name: Verify account API
on:
  push:
    branches: [master, 'feature/**']
    tags: ['*beta*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_TEST_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - run: go test -mod=readonly ./...
      - run: CGO_ENABLED=1 go build -mod=readonly -trimpath -o /tmp/apimain ./cmd/apimain.go
